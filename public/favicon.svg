<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Achrona emblem, simplified to read at 16px: three crystals on a cyan rune rim. -->
  <defs>
    <linearGradient id="crystal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9a8ff"/>
      <stop offset="1" stop-color="#7a3fe0"/>
    </linearGradient>
    <!-- The rift-to-copper edge of the sign-in card -->
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c43dff"/>
      <stop offset=".55" stop-color="#5b3fd0"/>
      <stop offset="1" stop-color="#d9803f"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#15172a" stroke="url(#edge)" stroke-width="3"/>
  <!-- side crystals -->
  <polygon points="17,22 23,28 23,46 11,46 11,28" fill="url(#crystal)"/>
  <polygon points="17,22 11,28 11,46 15,46 15,28" fill="#fff" opacity=".22"/>
  <polygon points="47,22 53,28 53,46 41,46 41,28" fill="url(#crystal)"/>
  <polygon points="47,22 53,28 53,46 49,46 49,28" fill="#000" opacity=".25"/>
  <!-- centre crystal -->
  <polygon points="32,8 40,16 40,46 24,46 24,16" fill="url(#crystal)"/>
  <polygon points="32,8 24,16 24,46 30,46 30,16" fill="#fff" opacity=".25"/>
  <polygon points="32,8 40,16 40,46 35,46 35,16" fill="#000" opacity=".22"/>
  <!-- rune rim -->
  <rect x="8" y="46" width="48" height="6" rx="3" fill="#4df3ff"/>
  <rect x="21" y="46" width="2.5" height="6" fill="#15172a"/>
  <rect x="40.5" y="46" width="2.5" height="6" fill="#15172a"/>
</svg>

name: CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hackthefuture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s
          --health-timeout 3s --health-retries 20
    env:
      # Throwaway database inside this job, not a secret.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hackthefuture
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm db:setup
      - name: Start the app and check it reaches Postgres
        run: |
          pnpm start > server.log 2>&1 &
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors http://localhost:3000/api/health || { cat server.log; exit 1; }
          curl --fail --silent --show-error http://localhost:3000/ | grep -q GL-0142 || { cat server.log; exit 1; }
